# Pro（bob。有効な 30 日パス）の回答時間の計測（iOS で Pro を販売中のとき）:
# 和了形の点数計算の設定に「回答時間を計測する」のスイッチが出て、オンにして
# 始めると盤面に回答時間が出る。残数の表示は無い（無制限）。最後にスイッチを
# 戻す。回数の消費は Pro では記録されない。プランを読んでいる間のスイッチは
# 同じ testID のまま押せない（鍵の行は出さない）ので、押せるようになるのを待つ
appId: help.mahjong.score
---
- clearKeychain
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "次にやること"
    timeout: 20000
- runFlow:
    file: _sign-in.yaml
    env:
      EMAIL: bob@example.local
      PASSWORD: devpass1
- extendedWaitUntil:
    visible: "次にやること"
    timeout: 15000
- runFlow:
    file: _open-link.yaml
    env:
      LINK: "mahjong-scoring://practice/agari-score"
- extendedWaitUntil:
    visible:
      id: "setup-measure-time"
      enabled: true
    timeout: 15000
- tapOn:
    id: "setup-measure-time"
- takeScreenshot: practice-quota-pro-setup
- scrollUntilVisible:
    element: "開始する"
    direction: DOWN
- tapOn: "開始する"
- extendedWaitUntil:
    visible:
      id: "score-select"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "answer-time-badge"
    direction: DOWN
- assertNotVisible:
    id: "practice-quota-remaining"
- takeScreenshot: practice-quota-pro-board
- tapOn:
    id: "screen-back"
    optional: true
# 戻った設定は「開始する」まで送った位置のまま。上の計測のスイッチまで戻す
- scrollUntilVisible:
    element:
      id: "setup-measure-time"
      enabled: true
    direction: UP
    timeout: 10000
- tapOn:
    id: "setup-measure-time"
