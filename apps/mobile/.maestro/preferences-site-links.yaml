# ゲストの設定の入口: ホームのヘッダーに歯車は無い。マイページの「その他」に利用規約・
# プライバシーポリシー・お問い合わせ・運営者情報が並び（特商法の表記は無い）、
# プライバシーポリシーを押すと web のページが開く。設定を直接開くと会員限定ゲートが出る
appId: help.mahjong.score
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "次にやること"
    timeout: 20000
- assertNotVisible:
    id: "home-settings"
- tapOn:
    id: "home-mypage"
- assertNotVisible:
    id: "mypage-menu-settings"
- scrollUntilVisible:
    element:
      id: "site-link-company"
    direction: DOWN
- assertVisible:
    id: "site-link-terms"
- assertVisible:
    id: "site-link-privacy"
- assertVisible:
    id: "site-link-contact"
- assertNotVisible: "特定商取引法に基づく表記"
- takeScreenshot: preferences-site-links
- tapOn:
    id: "site-link-privacy"
- extendedWaitUntil:
    visible: ".*利用者のプライバシーを尊重し.*"
    timeout: 20000
- takeScreenshot: preferences-site-links-privacy
- launchApp
- openLink: "mahjong-scoring://preferences"
- extendedWaitUntil:
    visible:
      id: "preferences-members-gate"
    timeout: 10000
- assertNotVisible: "麻雀ルール"
- takeScreenshot: preferences-members-gate
