# 記録が残る人（bob）のホームの「本日の問題」のカードから出題画面を開き、
# 「わからない」で答え合わせへ進んで「もっと解く」の節を見て、× でホームへ戻る。
# 手元の web（:3200）とその DB に今日の問題があること（dev seed）。bob が今日もう
# 解いていればカードは「もう一度解く」になる（どちらでも同じ流れで進む）。
# 記録できたことは出題画面に出さない（実践練習と同じ盤面に保つ）ので、ホームへ
# 戻ったときのカードで確かめる。最初にゲストのホームにカードが無いことも見る
appId: help.mahjong.score
---
- clearKeychain
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "次にやること"
    timeout: 20000
# ゲストにはカードを出さない（「次にやること」の直下に置くので、出ていれば最初の画面に入る）
- assertNotVisible:
    id: "home-daily-problem"
- runFlow:
    file: _sign-in.yaml
    env:
      EMAIL: bob@example.local
      PASSWORD: devpass1
- extendedWaitUntil:
    visible: "次にやること"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "home-daily-problem"
    direction: DOWN
    timeout: 15000
- assertVisible: "本日の問題"
- takeScreenshot: daily-problem-home-card
- tapOn:
    id: "home-daily-problem-(start|review)"
- extendedWaitUntil:
    visible:
      id: "screen-close"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "daily-problem-reveal"
    direction: DOWN
- takeScreenshot: daily-problem-board
- tapOn:
    id: "daily-problem-reveal"
- scrollUntilVisible:
    element:
      id: "daily-problem-more"
    direction: DOWN
- assertVisible: "もっと解く"
- assertNotVisible: "解答を記録しました。"
- assertVisible:
    id: "practical-practice-card-agari-score"
- takeScreenshot: daily-problem-answered
- tapOn:
    id: "screen-close"
- extendedWaitUntil:
    visible: "次にやること"
    timeout: 10000
# 解答を送った後に戻ると、ホームのカードは解答済み（「もう一度解く」）になっている
- scrollUntilVisible:
    element:
      id: "home-daily-problem-review"
    direction: DOWN
    timeout: 15000
- takeScreenshot: daily-problem-home-answered
