# 昇級試験の本番の受験ゲート: 説明画面の下端の帯は常に「模試 / 本番の試験」の 2 つで、
# 受けられないときの本番は鍵の付いたボタンになり、押すとシートで理由と次の一手を出す。
# ゲストには登録 / ログイン、無級の alice が 4級（符）の試験を開くと先に取る級（5級）と
# 道場への導線。模試はどちらも受けられる
appId: help.mahjong.score
---
- clearKeychain
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "次にやること"
    timeout: 20000
- runFlow:
    file: _open-link.yaml
    env:
      LINK: "mahjong-scoring://exam/fu"
- extendedWaitUntil:
    visible:
      id: "start-exam-locked"
    timeout: 15000
- assertVisible:
    id: "start-training"
- assertNotVisible:
    id: "start-exam"
- takeScreenshot: exam-gate-guest
- tapOn:
    id: "start-exam-locked"
- extendedWaitUntil:
    visible:
      id: "exam-sign-up"
    timeout: 5000
- assertVisible:
    id: "exam-sign-in"
- takeScreenshot: exam-gate-guest-sheet
- tapOn:
    id: "exam-gate-close"
- runFlow:
    file: _sign-in.yaml
    env:
      EMAIL: alice@example.local
      PASSWORD: devpass1
- runFlow:
    file: _open-link.yaml
    env:
      LINK: "mahjong-scoring://exam/fu"
- extendedWaitUntil:
    visible:
      id: "start-exam-locked"
    timeout: 15000
- tapOn:
    id: "start-exam-locked"
- extendedWaitUntil:
    visible: "道場で次の目標を確認する"
    timeout: 5000
- takeScreenshot: exam-gate-locked
