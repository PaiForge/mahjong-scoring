# 記録が残る人（bob）のプロフィール編集: マイページの行から開き、入力の誤り
# （X のユーザー名に使えない文字）で理由が出て留まることを見てから、表示名と
# 自己紹介を書き換えて保存 → マイページの見出しが新しい名前になる。最後に
# 表示名をシードの値に戻す（戻せなくても dev seed をもう一度流せば戻る）。
# 手元の web（:3000）とその DB が動いていること
appId: help.mahjong.score
---
- clearKeychain
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "次にやること"
    timeout: 20000
- runFlow:
    file: _sign-in.yaml
    env:
      EMAIL: bob@example.local
      PASSWORD: devpass1
- extendedWaitUntil:
    visible: "次にやること"
    timeout: 15000
- tapOn:
    id: "home-mypage"
- extendedWaitUntil:
    visible:
      id: "mypage-menu-profile"
    timeout: 15000
- tapOn:
    id: "mypage-menu-profile"
- extendedWaitUntil:
    visible:
      id: "profile-edit-display-name"
    timeout: 15000
- takeScreenshot: profile-edit
# 入力の誤り: サーバーの検証の理由が出て、画面に留まる
- tapOn:
    id: "profile-edit-x"
- inputText: "bad-name"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "profile-edit-submit"
    direction: DOWN
- tapOn:
    id: "profile-edit-submit"
- extendedWaitUntil:
    visible: "X のユーザー名は.*"
    timeout: 10000
- takeScreenshot: profile-edit-invalid
- tapOn:
    id: "profile-edit-x"
- eraseText: 20
# 表示名と自己紹介を書き換えて保存
- scrollUntilVisible:
    element:
      id: "profile-edit-display-name"
    direction: UP
- tapOn:
    id: "profile-edit-display-name"
- eraseText: 60
- inputText: "Bob Edited"
- tapOn:
    id: "profile-edit-bio"
- eraseText: 60
- inputText: "Maestro test"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "profile-edit-submit"
    direction: DOWN
- tapOn:
    id: "profile-edit-submit"
- extendedWaitUntil:
    visible: "Bob Edited"
    timeout: 15000
- assertVisible: "@seed_bob"
- assertVisible:
    id: "mypage-menu-profile"
- takeScreenshot: profile-edit-saved
# 開き直すと保存した値が入っている。表示名をシードの値に戻す
- tapOn:
    id: "mypage-menu-profile"
- extendedWaitUntil:
    visible: "Maestro test"
    timeout: 15000
- tapOn:
    id: "profile-edit-display-name"
- eraseText: 60
- inputText: "ボブ（シード）"
- tapOn:
    id: "profile-edit-bio"
- eraseText: 60
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "profile-edit-submit"
    direction: DOWN
- tapOn:
    id: "profile-edit-submit"
# 編集画面の欄にも同じ文字があるので、マイページへ戻ったのを待ってから見る
- extendedWaitUntil:
    visible:
      id: "mypage-menu-profile"
    timeout: 15000
- assertVisible: "ボブ（シード）"
- assertNotVisible:
    id: "profile-edit-submit"
