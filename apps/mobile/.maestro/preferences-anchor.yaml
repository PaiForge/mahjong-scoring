# 設定の項目を指すリンク（`/preferences?item=`）: ログイン中（bob）が子のツモの入力の項目を
# 指して開くと、画面の下の方にあるその行まで送られ、淡緑の地で示される（先頭のほうの
# 項目は画面の外へ出る）
appId: help.mahjong.score
---
- clearKeychain
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "次にやること"
    timeout: 20000
- runFlow:
    file: _sign-in.yaml
    env:
      EMAIL: bob@example.local
      PASSWORD: devpass1
- extendedWaitUntil:
    visible: "次にやること"
    timeout: 15000
- runFlow:
    file: _open-link.yaml
    env:
      LINK: "mahjong-scoring://preferences?item=ko-tsumo-input"
- extendedWaitUntil:
    visible: "子のツモの点数を子・親に分けて選ぶ"
    timeout: 10000
- waitForAnimationToEnd
- assertVisible: "子のツモの点数を子・親に分けて選ぶ"
# 先頭のほうの項目は画面の外へ送られている（行まで動いた証拠）
- assertNotVisible: "連風牌の雀頭を4符にする"
- takeScreenshot: preferences-anchor
