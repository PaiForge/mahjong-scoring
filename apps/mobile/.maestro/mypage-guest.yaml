# ゲストのマイページ: ホームのヘッダーの人型のアイコンから開くと、中身の代わりに
# 記録の案内（登録 CTA）と、その下に登録すると並ぶ中身の見本が出て、登録画面へ進める
appId: help.mahjong.score
---
- clearKeychain
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "次にやること"
    timeout: 20000
- tapOn:
    id: "home-mypage"
- extendedWaitUntil:
    visible:
      id: "mypage-sign-up-cta"
    timeout: 10000
- assertVisible: "マイページ"
- assertVisible: ".*ここにあなたの記録が並びます.*"
- takeScreenshot: mypage-guest
- tapOn:
    id: "mypage-sign-up-cta"
- extendedWaitUntil:
    visible: "アカウント登録"
    timeout: 10000
