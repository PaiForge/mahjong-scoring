# 色の役割（ルートの CLAUDE.md「色の役割」）を撮る。ログイン中（bob）で、選択中の墨
# （練習一覧の切り替えと絞り込み・タブバー・ランキングの期間）、補助面の淡緑（順位の
# チップ）、正解・完了の緑（レッスンの済みマーク・道場の済んだ段）を並べる。
# 正誤と待ち牌の選択は design-surfaces が撮る。手元の web（:3000）と dev seed が要る
appId: help.mahjong.score
---
- clearKeychain
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "次にやること"
    timeout: 20000
- runFlow:
    file: _sign-in.yaml
    env:
      EMAIL: bob@example.local
      PASSWORD: devpass1
- extendedWaitUntil:
    visible: "次にやること"
    timeout: 15000
- takeScreenshot: home-signed-in
- openLink: "mahjong-scoring://practice"
- waitForAnimationToEnd
- takeScreenshot: practice-list
- openLink: "mahjong-scoring://lessons"
- waitForAnimationToEnd
- takeScreenshot: lessons
- openLink: "mahjong-scoring://dojo"
- waitForAnimationToEnd
- takeScreenshot: dojo-signed-in
- openLink: "mahjong-scoring://leaderboard"
- extendedWaitUntil:
    visible: ".*位"
    timeout: 15000
- takeScreenshot: leaderboard-index
