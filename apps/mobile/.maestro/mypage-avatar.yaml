# 記録が残る人（bob）のアバター: プロフィール編集で写真ライブラリから画像を選んで
# 上げ（iOS の標準の切り抜きで「Choose」）、マイページの見出しとホームのヘッダーの
# マイページの入口に出ることを見る。最後に削除して頭文字（ホームは人型のアイコン）に
# 戻す。写真はアプリのアイコンを addMedia でシミュレーターに足し、ライブラリの先頭
# （最新）を選ぶ。手元の web（:3000）とその DB・Storage が動いていること
appId: help.mahjong.score
---
- clearKeychain
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "次にやること"
    timeout: 20000
- runFlow:
    file: _sign-in.yaml
    env:
      EMAIL: bob@example.local
      PASSWORD: devpass1
- extendedWaitUntil:
    visible: "次にやること"
    timeout: 15000
- addMedia:
    - "../assets/icon.png"
- tapOn:
    id: "home-mypage"
- extendedWaitUntil:
    visible:
      id: "mypage-menu-profile"
    timeout: 15000
- tapOn:
    id: "mypage-menu-profile"
- extendedWaitUntil:
    visible:
      id: "profile-edit-avatar-change"
    timeout: 15000
- takeScreenshot: avatar-before
- tapOn:
    id: "profile-edit-avatar-change"
# システムの写真の選択（PHPicker）と切り抜きの画面。文字は端末の言語で変わるので
# 印（resource-id）で引く
- extendedWaitUntil:
    visible:
      id: "PXGGridLayout-Info"
    timeout: 10000
- tapOn:
    id: "PXGGridLayout-Info"
    index: 0
- extendedWaitUntil:
    visible:
      id: "Done"
    timeout: 10000
- tapOn:
    id: "Done"
- extendedWaitUntil:
    visible: "アバターを更新しました。"
    timeout: 20000
- assertVisible:
    id: "profile-edit-avatar-remove"
- takeScreenshot: avatar-uploaded
- tapOn:
    id: "screen-back"
- extendedWaitUntil:
    visible: "@seed_bob"
    timeout: 15000
- takeScreenshot: avatar-mypage
# ホームのヘッダーの入口もアバターに替わる
- tapOn:
    id: "screen-back"
- extendedWaitUntil:
    visible: "次にやること"
    timeout: 15000
- takeScreenshot: avatar-home
# 削除して頭文字に戻す
- tapOn:
    id: "home-mypage"
- extendedWaitUntil:
    visible:
      id: "mypage-menu-profile"
    timeout: 15000
- tapOn:
    id: "mypage-menu-profile"
- extendedWaitUntil:
    visible:
      id: "profile-edit-avatar-remove"
    timeout: 15000
- tapOn:
    id: "profile-edit-avatar-remove"
- tapOn:
    id: "profile-edit-avatar-remove-dialog-confirm"
- extendedWaitUntil:
    visible: "アバターを削除しました。"
    timeout: 15000
- assertNotVisible:
    id: "profile-edit-avatar-remove"
- takeScreenshot: avatar-removed
- tapOn:
    id: "screen-back"
- extendedWaitUntil:
    visible: "@seed_bob"
    timeout: 15000
- tapOn:
    id: "screen-back"
- extendedWaitUntil:
    visible: "次にやること"
    timeout: 15000
- takeScreenshot: avatar-home-removed
