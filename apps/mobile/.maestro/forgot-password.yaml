# パスワードの再設定: ログイン画面の「パスワードを忘れた方」から bob@ に再設定の
# リンクを送り、送った案内が出る。メールは Mailpit（:54324）に届く
appId: help.mahjong.score
---
- launchApp:
    clearState: true
- openLink: "mahjong-scoring://sign-in"
- extendedWaitUntil:
    visible:
      id: "sign-in-forgot-password"
    timeout: 10000
- tapOn:
    id: "sign-in-forgot-password"
- extendedWaitUntil:
    visible:
      id: "forgot-password-submit"
    timeout: 10000
- tapOn:
    id: "forgot-password-email"
- inputText: bob@example.local
- takeScreenshot: forgot-password
- tapOn:
    id: "forgot-password-submit"
- extendedWaitUntil:
    visible:
      id: "forgot-password-sent"
    timeout: 15000
- takeScreenshot: forgot-password-sent
