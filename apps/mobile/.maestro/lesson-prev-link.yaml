# ゲストでレッスンの章末の「前のレッスン」を確かめる。目次から 2 章目を開き、
# 章末の「前のレッスン」で 1 章目（このアプリについて）へ移る。レッスン同士は
# 置き換えて移るので、ヘッダーの戻る 1 回で 2 章目ではなく目次へ帰る
appId: help.mahjong.score
---
- clearKeychain
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "次にやること"
    timeout: 20000
- runFlow:
    file: _open-link.yaml
    env:
      LINK: "mahjong-scoring://lessons"
- tapOn:
    id: "chapter-why-scoring-is-hard-to-learn"
- scrollUntilVisible:
    element:
      id: "prev-lesson-link"
    direction: DOWN
- takeScreenshot: lesson-prev-link
- tapOn:
    id: "prev-lesson-link"
- extendedWaitUntil:
    visible: "このアプリについて"
    timeout: 5000
- runFlow:
    file: _back.yaml
    env:
      BACK_TO: "chapter-why-scoring-is-hard-to-learn"
- extendedWaitUntil:
    visible:
      id: "chapter-why-scoring-is-hard-to-learn"
    timeout: 5000
- takeScreenshot: lesson-prev-link-back-to-toc
