# 記録が残る人（bob）: ホームに案内は出ず、チャレンジの結果に「成績を記録しました」と
# 獲得した EXP が出る。雀頭の符計算を最初の選択肢を押し続けて終わらせる（ミス 3 回か
# 時間切れ）。手元の web（:3000）とその DB が動いていること
appId: help.mahjong.score
---
- clearKeychain
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "次にやること"
    timeout: 20000
- runFlow:
    file: _sign-in.yaml
    env:
      EMAIL: bob@example.local
      PASSWORD: devpass1
- extendedWaitUntil:
    visible: "次にやること"
    timeout: 15000
- assertNotVisible:
    id: "home-sign-up-cta"
- assertNotVisible:
    id: "home-username-cta"
- takeScreenshot: home-signed-in
- openLink: "mahjong-scoring://practice/jantou-fu/play"
- extendedWaitUntil:
    visible:
      id: "choice-0"
    timeout: 15000
- repeat:
    while:
      notVisible: "結果"
    times: 60
    commands:
      - tapOn:
          id: "choice-0"
          optional: true
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "結果"
    timeout: 70000
- extendedWaitUntil:
    visible:
      id: "exp-gain"
    timeout: 15000
- assertVisible:
    id: "record-status"
- takeScreenshot: challenge-result
