# 記録が残る人（bob）: チャレンジの中止の確認が開き、「続ける」で戻った後も操作でき、
# もう一度開いて中止できる。以前は一時停止の送信で盤面の包みの平坦化が外れ、
# 確認（Modal）が iOS で表示に失敗して、押せない一時停止の画面が残った。
# 手元の web（:3000）とその DB が動いていること
appId: help.mahjong.score
---
- clearKeychain
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "次にやること"
    timeout: 20000
- runFlow:
    file: _sign-in.yaml
    env:
      EMAIL: bob@example.local
      PASSWORD: devpass1
- extendedWaitUntil:
    visible: "次にやること"
    timeout: 15000
- openLink: "mahjong-scoring://practice/jantou-fu/play"
- extendedWaitUntil:
    visible:
      id: "choice-0"
    timeout: 15000
# カウントダウン（3, 2, 1）が終わるまで待つ
- extendedWaitUntil:
    notVisible: "^[123]$"
    timeout: 8000
# 閉じる → 中止の確認 → 続ける
- tapOn:
    id: "screen-back"
- extendedWaitUntil:
    visible: "チャレンジを中止しますか？"
    timeout: 5000
- takeScreenshot: quit-dialog
- tapOn: "続ける"
- waitForAnimationToEnd
# 戻った盤面で答えられる
- tapOn:
    id: "choice-0"
- extendedWaitUntil:
    visible: "不正解: 1|正解: 1"
    timeout: 5000
- takeScreenshot: answered-after-cancel
# もう一度開いて中止する
- tapOn:
    id: "screen-back"
- extendedWaitUntil:
    visible: "チャレンジを中止しますか？"
    timeout: 5000
- tapOn: "中止する"
- extendedWaitUntil:
    visible: "チャレンジを中止しました"
    timeout: 5000
- takeScreenshot: quit-toast
